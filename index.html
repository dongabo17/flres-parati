<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffd85c">
  <meta name="description" content="Unas flores amarillas para alegrarte el día.">
  <title>Para ti 💛</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700&family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=4">
</head>
<body>
  <div class="sky-glow" aria-hidden="true"></div>
  <div class="petals" aria-hidden="true"></div>

  <main class="page-shell">
    <section class="card" aria-labelledby="title">
      <div class="sparkle sparkle-one" aria-hidden="true">✦</div>
      <div class="sparkle sparkle-two" aria-hidden="true">✧</div>
      <p class="eyebrow">Un detallito especial</p>
      <h1 id="title">Para ti <span aria-hidden="true">💛</span></h1>
      <p class="message">Unas flores amarillas para alegrarte el día, porque te mereces muchos momentos bonitos <span aria-hidden="true">💛🌻</span></p>
      <button class="surprise-button" type="button" id="surpriseButton">
        <span>Presiona para una sorpresa</span>
        <span class="button-icon" aria-hidden="true">✨</span>
      </button>
      <p class="secret-message" id="secretMessage" aria-live="polite">Que nunca te falten razones para sonreír 🌼</p>
    </section>

    <section class="bouquet-space" aria-label="Un ramo gigante de flores amarillas">
      <div class="bouquet" aria-hidden="true">
        <div class="bouquet-flower flower-a">🌻</div>
        <div class="bouquet-flower flower-b">🌼</div>
        <div class="bouquet-flower flower-c">🌻</div>
        <div class="bouquet-flower flower-d">🌼</div>
        <div class="bouquet-flower flower-e">🌻</div>
        <div class="bouquet-flower flower-f">🌻</div>
        <div class="bouquet-stems"></div>
        <div class="bouquet-paper"></div>
        <div class="bouquet-ribbon">🎀</div>
      </div>
    </section>

    <p class="footer-note">Con cariño, para hacerte sonreír 🌞</p>
  </main>

  <script src="script.js?v=4"></script>
</body>
</html>
